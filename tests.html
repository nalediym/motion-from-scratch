<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tests · Motion from Scratch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Inter:wght@500;900&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Silkscreen&display=swap">
<link rel="stylesheet" href="lib/style.css">
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:14px">
    <div class="pegbar" aria-hidden="true"><i></i><i></i><i></i></div>
    <span class="eyebrow">Motion from Scratch · tests</span>
    <h1>Your work, checked</h1>
    <p class="lede">Every test and picture below runs your code. Working in an editor? Save a file, then reload this page, or run <code>node tests/run.js</code> in a terminal.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="rerun" type="button">Reload and re-run</button>
      <a class="btn ghost" href="index.html" style="text-decoration:none">Course home</a>
    </div>
  </header>
  <div id="errors" hidden></div>
  <p class="lede" id="from-guide" hidden></p>
  <main id="layers" style="display:flex;flex-direction:column;gap:24px"></main>
</div>

<script src="lib/course.js"></script>
<script src="lib/loader.js"></script>
<script>
(async function () {
  document.getElementById("rerun").addEventListener("click", () => location.reload());
  const { ready, errors } = await MS.loadCourse();
  const errBox = document.getElementById("errors");
  if (errors.length) {
    errBox.hidden = false;
    errBox.innerHTML = errors.map(e => `<div class="banner"><strong>${e.file}</strong> line ${e.line}: ${e.message}<br><span style="color:var(--muted)">Fix this first. Tests that depend on this file can't run until it loads.</span></div>`).join("");
  }
  const fromGuide = MS.useGuideWork(ready);
  if (fromGuide.length) { const note = document.getElementById("from-guide"); note.hidden = false; const ids = fromGuide.length > 1 ? "Layers " + fromGuide.slice(0, -1).join(", ") + " and " + fromGuide[fromGuide.length - 1] + " use" : "Layer " + fromGuide[0] + " uses"; note.textContent = ids + " your work from the guide, saved in this browser."; }
  const mark = { pass: "✓", fail: "✗", todo: "·" };
  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const root = document.getElementById("layers");
  for (const l of ready) {
    const results = MS.runTests(l.id);
    const passed = results.filter(r => r.status === "pass").length;
    const sec = document.createElement("section");
    sec.className = "sheet"; sec.id = "layer-" + l.id;
    sec.innerHTML = `
      <div class="layer-head"><span class="num">${l.id}</span><h2>${l.title}</h2><span class="score">${passed} / ${results.length}</span></div>
      <ul class="results">${MS.quietTodos(results).map(r => `<li class="${r.status}"><span class="mark" aria-label="${r.status}">${mark[r.status]}</span><span>${esc(r.name)}${r.message ? `<span class="msg">${esc(r.message)}</span>` : ""}</span></li>`).join("")}</ul>
      <div class="visuals"></div>
      <div class="checkpoint"></div>`;
    const vis = sec.querySelector(".visuals");
    for (const v of MS.visuals.filter(v => v.layer === l.id)) vis.appendChild(MS.figure(v, 260));
    const cp = MS.runCheckpoint(l.id, results);
    MS.showCheckpoint(sec.querySelector(".checkpoint"), cp, fromGuide.includes(l.id) ? "the guide" : MS.COURSE.files(l).checkpoint);
    if (cp.complete) sec.classList.add("complete");
    root.appendChild(sec);
  }
})();
</script>
</body>
</html>
