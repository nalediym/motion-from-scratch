name: Publish site

# Builds the course site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the generated guide and notebooks are up to date
        run: |
          node tools/build-guide.js
          node tools/build-notebooks.js
          if ! git diff --quiet -- guide.html notebooks/; then
            echo "::error::guide.html or notebooks/ are out of date. Run: node tools/build-guide.js && node tools/build-notebooks.js, then commit."
            git diff --stat -- guide.html notebooks/
            exit 1
          fi

      # Installed locally (not via npx): the build resolves its theme fonts
      # from ./node_modules, which a temporary npx install doesn't provide.
      - name: Build the Observable notebook (Notebook Kit CLI)
        run: |
          npm install --no-save --no-package-lock @observablehq/notebook-kit@2.7.0
          ./node_modules/.bin/notebooks build --root notebooks -- notebooks/observable.html

      - name: Assemble the site
        run: |
          mkdir -p _site/observable
          cp -r index.html guide.html tests.html lib src tests docs notebooks tools LICENSE README.md AGENTS.md _site/
          rm -rf _site/notebooks/.observable
          cp -r notebooks/.observable/dist/. _site/observable/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
